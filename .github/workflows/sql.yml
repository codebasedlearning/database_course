name: SQL scripts

# Runs every course script against the same PostgreSQL version the students use
# (see docker/compose.yml) and fails on unexpected errors, see tests/check_sql.py.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: root
      PGPASSWORD: root
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run all scripts
        run: python3 tests/check_sql.py
